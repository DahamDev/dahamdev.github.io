    <script>
        (() => {
            const toggle = document.querySelector('.nav-toggle');
            const nav = document.querySelector('.nav-right');
            if (!toggle || !nav) return;
            const setMenu = open => {
                toggle.setAttribute('aria-expanded', String(open));
                toggle.setAttribute('aria-label', open ? 'Close navigation' : 'Open navigation');
                nav.classList.toggle('active', open);
            };
            toggle.addEventListener('click', () => setMenu(toggle.getAttribute('aria-expanded') !== 'true'));
            nav.querySelectorAll('a').forEach(link => link.addEventListener('click', () => setMenu(false)));
            document.addEventListener('keydown', event => {
                if (event.key === 'Escape' && toggle.getAttribute('aria-expanded') === 'true') {
                    setMenu(false);
                    toggle.focus();
                }
            });

            const hero = document.querySelector('.home-hero');
            const parallaxLayers = hero?.querySelectorAll('[data-parallax-speed]');
            if (hero && parallaxLayers?.length && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
                let frame = 0;
                const updateParallax = () => {
                    cancelAnimationFrame(frame);
                    frame = requestAnimationFrame(() => {
                        const heroTop = hero.getBoundingClientRect().top + window.scrollY;
                        const scrolledPastHeroTop = Math.max(0, heroTop - hero.getBoundingClientRect().top);
                        parallaxLayers.forEach(layer => {
                            const speed = Number(layer.dataset.parallaxSpeed) || 0;
                            layer.style.setProperty('--parallax-y', `${scrolledPastHeroTop * speed}px`);
                        });
                    });
                };
                window.addEventListener('scroll', updateParallax, { passive: true });
                window.addEventListener('resize', updateParallax, { passive: true });
                updateParallax();
            }
        })();
    </script>
